<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OvIAmigo | IA sin humo para tu negocio</title>
<meta name="description" content="Tu amigo con IA para negocios de Paraguay y de cualquier país. Webs, videos, WhatsApp con IA, dominio y más. Sin humo y con humor.">
<meta property="og:title" content="OvIAmigo | IA sin humo para tu negocio">
<meta property="og:description" content="IA que sí sirve para tu negocio, sin humo y con humor.">
<meta name="theme-color" content="#FFD60A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFD60A; --ink: #13161B; --leaf: #3FCF8E; --pop: #FF4D8D; --sky: #4DA3FF; --paper: #FFFFFF;
    --bg: var(--sun); --dot: rgba(19, 22, 27, .10); --card: var(--paper); --text: var(--ink); --muted: #4a4f5a; --edge: var(--ink);
    color-scheme: light;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161B; --dot: rgba(255, 214, 10, .10); --card: #1E2330; --text: #F4F5F7; --muted: #AEB4C0; --edge: #FFD60A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] { --bg: #13161B; --dot: rgba(255, 214, 10, .10); --card: #1E2330; --text: #F4F5F7; --muted: #AEB4C0; --edge: #FFD60A; color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: "Montserrat", "Segoe UI", Roboto, Arial, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2.4px, transparent 2.6px);
    background-size: 26px 26px;
  }
  main { max-width: 470px; margin: 0 auto; padding: 44px 20px 36px; }

  /* cabecera: el avatar es un sticker pegado, el nombre es el chiste */
  .hero { text-align: center; }
  .avatar {
    width: 132px; height: 132px; margin: 0 auto 6px; border-radius: 50%; overflow: hidden; display: block;
    border: 5px solid var(--paper); outline: 4px solid var(--ink); box-shadow: 6px 7px 0 var(--ink);
    transform: rotate(-4deg); animation: stick .7s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes stick { from { transform: rotate(-16deg) scale(.4); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
  h1 {
    font-family: "Bangers", Impact, "Arial Black", sans-serif; font-weight: 400; letter-spacing: .02em;
    font-size: clamp(56px, 16vw, 76px); line-height: 1; margin: 14px 0 6px; color: var(--paper);
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--ink);
  }
  h1 .ia { color: var(--pop); }
  .hero { position: relative; }
  .robot-chat { position: absolute; left: calc(50% + 76px); top: -6px; width: 92px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ink); z-index: 2; -webkit-tap-highlight-color: transparent; }
  .rc-robot { width: 66px; height: 79px; overflow: visible; animation: flota 4s ease-in-out infinite; filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); }
  .rc-burbuja { position: relative; margin-bottom: 8px; padding: 5px 9px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); font-weight: 800; font-size: 13px; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); }
  .rc-burbuja::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; margin-left: -5px; background: #fff; border: 2.5px solid var(--ink); border-top: 0; border-left: 0; transform: rotate(45deg); }
  .robot-chat:active .rc-burbuja { background: var(--sun); }
  @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (max-width: 380px) { .robot-chat { left: calc(50% + 70px); width: 80px; } .rc-robot { width: 56px; height: 67px; } }
  @media (prefers-reduced-motion: reduce) { .rc-robot { animation: none; } }
  .tagline { font-weight: 800; font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-weight: 500; font-size: 15px; margin: 0; }

  /* botones tipo sticker: bordes gruesos y sombra dura que se aplasta al tocar */
  .links { display: grid; gap: 16px; margin-top: 30px; }
  .btn {
    display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 14px; text-decoration: none; color: var(--text);
    background: var(--card); border: 3px solid var(--edge); border-radius: 20px; padding: 12px 16px 12px 12px;
    box-shadow: 0 6px 0 var(--edge); transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge); }
  .btn:focus-visible, button:focus-visible, input:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
  .icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; border: 2.5px solid var(--ink); }
  .icon svg { width: 28px; height: 28px; }
  .label { display: block; font-weight: 800; font-size: 17px; line-height: 1.2; }
  .detail { display: block; color: var(--muted); font-weight: 500; font-size: 14px; margin-top: 2px; }

  .btn.main { background: var(--leaf); border-color: var(--ink); box-shadow: 0 7px 0 var(--ink); color: var(--ink); transform: rotate(-1deg); padding: 16px 18px 16px 14px; }
  .btn.main:active { transform: rotate(-1deg) translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .btn.main .label { font-size: 20px; }
  .btn.main .detail { color: #1d3a2d; }
  .btn.main .icon { background: var(--paper); }

  .ig .icon { background: linear-gradient(135deg, #FEDA75, #FA7E1E 35%, #D62976 65%, #4F5BD5); }
  .tt .icon { background: #111; }
  .yt .icon { background: #FF0000; }
  .x .icon { background: #000; }
  .web .icon { background: var(--sun); overflow: hidden; }
  .web .icon svg { width: 44px; height: 44px; margin-top: 2px; }
  .serv .icon { background: #2B2F9E; font-size: 26px; }
  .bot .icon { background: var(--sun); font-size: 26px; }

  /* calculadora */
  .calc { background: var(--card); border: 3px solid var(--edge); border-radius: 20px; box-shadow: 0 6px 0 var(--edge); overflow: hidden; }
  .calc summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 12px 16px 12px 12px; }
  .calc summary::-webkit-details-marker { display: none; }
  .calc summary .icon { background: var(--sun); font-size: 26px; }
  .calc[open] summary { border-bottom: 3px dashed var(--edge); }
  .calc-body { padding: 16px 16px 18px; display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 118px; align-items: center; gap: 10px; }
  .calc-body > * { min-width: 0; }
  .row label { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .row input {
    box-sizing: border-box; width: 100%; min-width: 0; font: 800 17px "Montserrat", sans-serif; text-align: right; color: var(--ink); background: #FFF8D6;
    border: 2.5px solid var(--ink); border-radius: 12px; padding: 9px 10px;
  }
  .result { margin-top: 4px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 14px 16px; text-align: center; }
  .result .big { font-family: "Bangers", Impact, sans-serif; font-size: clamp(40px, 12vw, 52px); letter-spacing: .03em; color: var(--sun); display: block; line-height: 1.05; }
  .result p { margin: 4px 0 0; font-size: 14px; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); margin: 0; }
  .calc .btn { box-shadow: 0 5px 0 var(--edge); }

  .lead { background: var(--leaf); border-color: var(--ink); box-shadow: 0 7px 0 var(--ink); }
  .lead summary { color: var(--ink); }
  .lead summary .icon { background: var(--paper); }
  .lead summary .label { font-size: 19px; }
  .lead summary .detail { color: #1d3a2d; }
  .lead[open] summary { border-bottom: 3px dashed var(--ink); }
  .lead .calc-body { background: var(--card); color: var(--text); }
  .chat-wrap { background: var(--card); color: var(--text); padding: 12px 14px 16px; }
  .steps { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
  .steps .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(127, 127, 127, .22); overflow: hidden; }
  .steps .bar i { display: block; height: 100%; width: 0; background: var(--leaf); border-radius: 99px; transition: width .35s ease; }
  .chat { display: grid; gap: 8px; }
  .b { max-width: 86%; padding: 10px 14px; font-size: 15.5px; font-weight: 600; line-height: 1.35; border: 2.5px solid var(--edge); animation: pop .22s ease-out both; }
  .b.bot { justify-self: start; background: var(--card); border-radius: 18px 18px 18px 6px; }
  .b.me { justify-self: end; background: var(--sun); color: var(--ink); border-color: var(--ink); border-radius: 18px 18px 6px 18px; }
  .typing { display: inline-flex; gap: 5px; padding: 13px 14px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .dock { margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 700 15px "Montserrat", sans-serif; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 10px 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; text-decoration: none; display: inline-block; transition: transform .08s ease, box-shadow .08s ease;
  }
  .chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .chip.hot { background: #2B2F9E; color: var(--paper); }
  .chip.go { background: var(--leaf); }
  .cat { display: grid; gap: 8px; }
  .grp { border: 2.5px solid var(--edge); border-radius: 16px; background: var(--card); overflow: hidden; }
  .grp.has { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .grp-h { width: 100%; display: grid; grid-template-columns: 1fr auto 22px; align-items: center; gap: 8px; padding: 13px 14px; background: transparent; border: 0;
    font: 800 16px "Montserrat", sans-serif; color: var(--text); text-align: left; cursor: pointer; }
  .grp.has .grp-h { background: var(--sun); color: var(--ink); }
  .grp-n { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .grp.has .grp-n { color: var(--ink); }
  .grp-c { transition: transform .2s ease; text-align: center; }
  .grp.open .grp-c { transform: rotate(180deg); }
  .grp-b { padding: 4px 12px 14px; }
  .grp-b[hidden] { display: none !important; }
  .grp-h, .cat-go, .send, .chip, .ask, .ask button { box-sizing: border-box; max-width: 100%; }
  .grp-h:focus-visible { outline: 4px solid var(--sky); outline-offset: -4px; }
  .cat-g { margin: 6px 0 0; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chip.opt { font-size: 14px; padding: 9px 12px; }
  .chip.opt.on { background: var(--sun); box-shadow: 0 2px 0 var(--ink); transform: translateY(2px); }
  .chip.opt.on::after { content: " ✓"; font-weight: 800; }
  .cat-foot { display: grid; gap: 10px; margin-top: 10px; justify-items: start; }
  .send {
    font: 800 17px "Montserrat", sans-serif; color: var(--ink); background: var(--leaf); border: 3px solid var(--ink); border-radius: 16px;
    padding: 14px 16px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease;
  }
  .send:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .cat-go { width: 100%; }
  .chip.opt { text-align: left; }
  .cat-go:disabled { background: #EDEDED; color: #777; box-shadow: 0 3px 0 #999; }
  .ask { display: grid; grid-template-columns: auto 1fr 52px; align-items: center; gap: 8px; border: 2.5px solid var(--ink); border-radius: 999px; background: #FFF8D6; padding: 4px 4px 4px 14px; }
  .ask .pre { font-weight: 800; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .ask .pais { position: relative; padding-right: 16px; }
  .ask .pais::after { content: "▾"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 13px; }
  .ask .pais select { position: absolute; inset: -8px -4px; width: calc(100% + 8px); height: calc(100% + 16px); opacity: 0; cursor: pointer; font-size: 16px; }
  .row select { box-sizing: border-box; width: 100%; min-width: 0; font: 800 15px "Montserrat", sans-serif; color: var(--ink); background: #FFF8D6; border: 2.5px solid var(--ink); border-radius: 12px; padding: 9px 6px; }
  .ask input { box-sizing: border-box; min-width: 0; width: 100%; border: 0; background: transparent; font: 700 17px "Montserrat", sans-serif; color: var(--ink); padding: 10px 2px; outline: none; }
  .ask input::placeholder { color: #8a8470; font-weight: 600; }
  .ask button { width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--leaf); font-size: 20px; cursor: pointer; color: var(--ink); }
  .ask:focus-within { outline: 4px solid var(--sky); outline-offset: 2px; }
  .shake { animation: shake .35s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .sending { margin: 0; font-weight: 700; color: var(--muted); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .consent-note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
  .as-btn { width: 100%; text-align: left; font: inherit; cursor: pointer; }
  .soon { opacity: .7; border-style: dashed; box-shadow: none; pointer-events: none; }
  .soon .icon { background: transparent; }

  footer { text-align: center; margin-top: 34px; font-size: 13px; color: var(--muted); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .avatar, .b, .typing span, .shake { animation: none; } .btn, .btn:active { transition: none; } }

  /* ===== tema futurista: azul noche con resplandor violeta (igual que la web) ===== */
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] { --bg: #0B0F24; --card: #FFFFFF; --text: #13161B; --muted: #4a4f5a; --edge: #0B0F24; color-scheme: dark; }
  body {
    color: #E8EEFF; background-color: #0B0F24; background-attachment: fixed;
    background-image: radial-gradient(circle at 88% 4%, rgba(150, 70, 170, .55), transparent 44%), radial-gradient(circle at 4% 96%, rgba(77, 163, 255, .25), transparent 42%), linear-gradient(180deg, #121738 0%, #0B0F24 100%);
    background-size: auto;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(rgba(124, 177, 255, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 177, 255, .09) 1px, transparent 1px);
    background-size: 40px 40px; -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 75%); }
  .avatar { border-color: #fff; outline: 4px solid var(--sun); box-shadow: 0 0 34px rgba(255, 214, 10, .35), 0 0 70px rgba(124, 177, 255, .25); }
  h1 { color: var(--sun); -webkit-text-stroke: 3px #0B0F24; text-shadow: 0 0 26px rgba(255, 214, 10, .4), 3px 4px 0 #000; }
  h1 .ia { color: var(--pop); }
  .tagline { color: #E8EEFF; }
  .btn { border-color: #0B0F24; box-shadow: 0 6px 0 var(--sun); }
  .btn:active { box-shadow: 0 1px 0 var(--sun); }
  .btn:focus-visible { outline-color: var(--sun); }
  .icon { border-color: #0B0F24; }
